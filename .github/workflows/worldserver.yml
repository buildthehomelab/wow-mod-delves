name: Delve worldserver link
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  changes:
    uses: ./.github/workflows/changes.yml
  worldserver:
    needs: changes
    if: needs.changes.outputs.run_checks == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: buildthehomelab/wow-azerothcore
          ref: 9e4a232a84d375a8906717c5139fb8d6bf2e41d6
          path: .core
      - uses: actions/checkout@v4
        with:
          repository: buildthehomelab/wow-mod-boss-coins
          ref: 472de63ffc3a321c1226bc38c294e6589a89b32c
          path: .wallet
      - name: Install core build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          cmake ninja-build g++ libssl-dev default-libmysqlclient-dev
          libboost-filesystem-dev libboost-program-options-dev libboost-iostreams-dev
          libboost-regex-dev libboost-thread-dev libreadline-dev zlib1g-dev libbz2-dev
      - name: Stage delve and durable wallet modules in the isolated core checkout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          module = Path('.core/modules/mod-delves')
          module.mkdir()
          shutil.copy2('CMakeLists.txt', module / 'CMakeLists.txt')
          shutil.copytree('src', module / 'src')
          shutil.copytree('conf', module / 'conf')
          wallet = Path('.core/modules/mod-boss-coins')
          wallet.mkdir()
          shutil.copy2('.wallet/CMakeLists.txt', wallet / 'CMakeLists.txt')
          shutil.copytree('.wallet/src', wallet / 'src')
          shutil.copytree('.wallet/conf', wallet / 'conf')
          PY
      - name: Configure worldserver with the static module
        run: >-
          cmake -S .core -B core-build -G Ninja
          -DCMAKE_BUILD_TYPE=Release -DAPPS_BUILD=world-only -DTOOLS_BUILD=none
          -DSCRIPTS=none -DMODULES=static -DNOPCH=1 -DBUILD_TESTING=OFF
      - name: Compile and link worldserver
        run: cmake --build core-build --target worldserver --parallel 2
      - name: Verify the delve loader is in the linked executable
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          binary = Path('core-build/src/server/apps/worldserver')
          assert binary.is_file(), 'worldserver executable missing'
          symbols = subprocess.check_output(['nm', '--demangle', str(binary)], text=True)
          assert 'Addmod_delvesScripts()' in symbols, 'delve module loader was not linked'
          assert 'Addmod_boss_coinsScripts()' in symbols, 'wallet loader missing'
          assert 'BossCoins::Wallet::AwardDelveOnce(' in symbols, 'durable API missing'
          assert b'Delve award run' in binary.read_bytes(), 'delivery compiled without the wallet API'
          assert b'Delve rewards require the reviewed' not in binary.read_bytes(), 'fallback wallet guard compiled'
          print('worldserver linked both modules and the real durable reward delivery path')
          PY
      - name: Check enabled module registration before databases start
        run: >-
          python3 tools/check_pre_database_startup.py --core .core
          --binary core-build/src/server/apps/worldserver
